<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif">
  <title id="title">Two independent ledgers connected by sequences</title>
  <desc id="desc">The service ledger records selectability, accumulated service, admission and credit rules, and selection. Its proof has no hardware-cost premise. Independently, the execution ledger records executors, communication, scheduler work, and protected-state movement. Its performance accounting assumes no fairness theorem. The connection is a selected-client sequence mapped through the execution architecture to an executor sequence. The illustrative mapping A, B, A to core 0, core 1, core 0 is caller execution on distinct fixed cores, not a CFL trace or a theorem dependency.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#526575"/></marker></defs>
  <rect width="800" height="620" fill="white"/>
  <text x="32" y="43" font-size="28" font-weight="700" fill="#18323D">Ask two questions independently</text>
  <rect x="24" y="76" width="366" height="253" rx="12" fill="#F1F5F7" stroke="#7057A3" stroke-width="2"/>
  <rect x="410" y="76" width="366" height="253" rx="12" fill="#F1F5F7" stroke="#526575" stroke-width="2"/>
  <text x="44" y="114" font-size="26" font-weight="700" fill="#7057A3">Service ledger</text>
  <text x="430" y="114" font-size="26" font-weight="700" fill="#18323D">Execution ledger</text>
  <text x="44" y="151" font-size="22" fill="#18323D"><tspan x="44">Who is selectable?</tspan><tspan x="44" dy="33">How much service so far?</tspan><tspan x="44" dy="33">Who is selected next?</tspan></text>
  <text x="430" y="151" font-size="22" fill="#18323D"><tspan x="430">Who executes?</tspan><tspan x="430" dy="33">Communication + scheduling</tspan><tspan x="430" dy="33">Protected-state movement</tspan></text>
  <path d="M44 243H370 M430 243H756" stroke="#526575" stroke-width="1"/>
  <text x="44" y="275" font-size="20" fill="#7057A3"><tspan x="44">No hardware term</tspan><tspan x="44" dy="27">in the service proof.</tspan></text>
  <text x="430" y="275" font-size="20" fill="#18323D"><tspan x="430">No fairness assumption</tspan><tspan x="430" dy="27">in performance accounting.</tspan></text>
  <text x="32" y="372" font-size="22" font-weight="700" fill="#18323D">Their connection: map clients to executors</text>
  <text x="32" y="420" font-size="20" fill="#18323D">Selected clients</text>
  <rect x="270" y="393" width="84" height="44" rx="8" fill="#167D8D"/>
  <rect x="400" y="393" width="84" height="44" rx="8" fill="#C86D35"/>
  <rect x="530" y="393" width="84" height="44" rx="8" fill="#167D8D"/>
  <text x="312" y="423" text-anchor="middle" font-size="24" font-weight="700" fill="white">A</text>
  <text x="442" y="423" text-anchor="middle" font-size="24" font-weight="700" fill="white">B</text>
  <text x="572" y="423" text-anchor="middle" font-size="24" font-weight="700" fill="white">A</text>
  <path d="M312 444V478" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M442 444V478" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M572 444V478" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="455" font-size="20" fill="#526575"><tspan x="636">caller</tspan><tspan x="636" dy="25">execution</tspan></text>
  <text x="32" y="512" font-size="20" fill="#18323D">Executing cores</text>
  <rect x="263" y="485" width="98" height="44" rx="8" fill="white" stroke="#167D8D" stroke-width="2"/>
  <rect x="393" y="485" width="98" height="44" rx="8" fill="white" stroke="#C86D35" stroke-width="2"/>
  <rect x="523" y="485" width="98" height="44" rx="8" fill="white" stroke="#167D8D" stroke-width="2"/>
  <text x="312" y="514" text-anchor="middle" font-size="22" fill="#18323D">core 0</text>
  <text x="442" y="514" text-anchor="middle" font-size="22" fill="#18323D">core 1</text>
  <text x="572" y="514" text-anchor="middle" font-size="22" fill="#18323D">core 0</text>
  <rect x="24" y="553" width="752" height="47" rx="10" fill="#F1F5F7"/>
  <text x="42" y="583" font-size="20" fill="#18323D">A sequence mapping connects the ledgers—not a shared proof premise.</text>
</svg>
