<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif">
  <title id="title">Competitiveness and policy overhead require different comparisons</title>
  <desc id="desc">Comparison A asks whether fair delegation is competitive: CFL versus FC-PQ, matching completed work, hardware resources, and service objective. Comparison B asks what the policy adds: policy enabled versus disabled inside the same delegation protocol with identical publication and batching infrastructure. Direct accounting and selection costs must be separated from indirect effects of changed order, locality, and occupancy. Original FC versus FC-PQ is not this controlled ablation. Arrows express comparisons, not numerical wins.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526575"/></marker></defs>
  <rect width="800" height="650" fill="white"/>
  <text x="30" y="42" font-size="28" font-weight="bold" fill="#18323D">Two questions need two comparisons</text>
  <rect x="30" y="67" width="740" height="200" rx="10" fill="#F1F5F7"/>
  <text x="50" y="99" font-size="24" font-weight="bold" fill="#18323D">A. Is fair delegation competitive?</text>
  <rect x="50" y="123" width="225" height="80" rx="8" fill="white" stroke="#C86D35" stroke-width="2"/>
  <text x="162" y="155" text-anchor="middle" font-size="25" fill="#C86D35"><tspan x="162">CFL</tspan><tspan x="162" dy="29" font-size="20">Caller execution</tspan></text>
  <rect x="525" y="123" width="225" height="80" rx="8" fill="white" stroke="#167D8D" stroke-width="2"/>
  <text x="637" y="155" text-anchor="middle" font-size="25" fill="#167D8D"><tspan x="637">FC-PQ</tspan><tspan x="637" dy="29" font-size="20">Delegation</tspan></text>
  <path d="M289 170 H511" stroke="#526575" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="154" text-anchor="middle" font-size="21" fill="#526575">Compare systems</text>
  <text x="400" y="242" text-anchor="middle" font-size="20" fill="#18323D">Match completed work, hardware resources, and service objective.</text>
  <text x="50" y="313" font-size="24" font-weight="bold" fill="#18323D">B. What does the policy add?</text>
  <rect x="30" y="334" width="740" height="241" rx="10" fill="#F1F5F7"/>
  <rect x="50" y="351" width="700" height="45" rx="6" fill="#18323D"/>
  <text x="400" y="380" text-anchor="middle" font-size="21" fill="white">Same delegation protocol: publication + batching</text>
  <path d="M175 396 V417" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M625 396 V417" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="50" y="421" width="250" height="51" rx="7" fill="white" stroke="#7057A3" stroke-width="2"/>
  <text x="175" y="453" text-anchor="middle" font-size="22" fill="#7057A3">Policy enabled</text>
  <rect x="500" y="421" width="250" height="51" rx="7" fill="white" stroke="#526575" stroke-width="2"/>
  <text x="625" y="453" text-anchor="middle" font-size="22" fill="#526575">Policy disabled</text>
  <path d="M314 448 H486" stroke="#526575" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="432" text-anchor="middle" font-size="20" fill="#526575">Ablation</text>
  <text x="50" y="512" font-size="21" font-weight="bold" fill="#7057A3">Direct policy costs</text>
  <text x="50" y="543" font-size="20" fill="#18323D">Accounting + selection</text>
  <path d="M388 492 V558" stroke="#526575" stroke-width="1"/>
  <text x="420" y="512" font-size="21" font-weight="bold" fill="#18323D">Indirect execution effects</text>
  <text x="420" y="543" font-size="20" fill="#18323D">Order, locality, occupancy</text>
  <text x="30" y="607" font-size="20" fill="#526575"><tspan x="30">Original FC vs FC-PQ is not the controlled policy ablation.</tspan><tspan x="30" dy="29">Comparison arrows are questions—not measured win margins.</tspan></text>
</svg>
