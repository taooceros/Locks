[package]
name = "coro_delegation"
version = "0.1.0"
edition = "2021"
description = "Delegation locks for a cooperatively scheduled (coroutine) executor: combiner-thread fairness study"

[dependencies]
async-task = "4"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
parking = "2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core_affinity = "0.8"

[[bin]]
name = "coro-bench"
path = "src/bin/coro_bench.rs"
