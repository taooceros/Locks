[package]
name = "libdlock"
version = "0.1.0"
edition = "2021"


[features]
default = ["combiner_stat"]
combiner_stat = []
# E0(b) FC-PQ fast-path ablation, all default-off
# (plan/2026-09-27/e0b-fcpq-fast-path.md, dlock2/README.md).
# D6: cache the enrolling thread's id in the node.
fcpq_cached_tid = []
# D1+D2+D4: serve an uncontended request directly under the combiner lock.
fcpq_fast_path = []
# Fast path without timestamps or usage charge (fairness-incorrect; ablation
# only). Mutually exclusive with fcpq_fast_path.
fcpq_fast_path_notime = []
# Per-thread fast-path hit counter: FCPQ::get_fast_path_hits/fast_path_hits.
fcpq_fast_path_stat = []
# Combiner pass statistics for FC and FC-PQ (bodies per pass, combiner changes;
# FC-PQ pass-length ablation, plan/2026-09-29/fcpq-pass-length-ablation.md).
# Default-off: only a separate stats build carries the counters.
combiner_pass_stat = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
bindgen = "0"
cc = "1.0"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
itertools = "0.12.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_with = { version = "3" }
serial_test = { version = "3" }
criterion = { version = "0.5.1", features = ["html_reports"] }


[dependencies]
core_affinity = "0"
intrusive-collections = "0.9"
linux-futex = "0.2.0"
num_cpus = "1"
once_cell = "1"
quanta = "0.12"
thread_local = "1.1"
enum_dispatch = "0.3"
crossbeam = "0.8"
crossbeam-skiplist = "0.1"
proc-macro2 = { version = ">=1.0.63" }
fastrand = "2"
trait-set = "0.3.0"
strum = { version = "0.26", features = ["derive"] }
derivative = "2.2.0"
debug_unwraps = "0.1.0"
arrayvec = "0.7.4"
ringbuffer = "0.15.0"
atomic_enum = "0.3.0"
lock_api = "0.4"
libc = "0.2"

