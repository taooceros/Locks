[package]
name = "upscaledb-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[features]
default = []
profile = ["libdlock/combiner_stat"]
spin_park = ["libdlock/spin_park"]
block_park = ["libdlock/block_park"]
test-hooks = []

[dependencies]
libdlock = { path = "../libdlock", default-features = false }
libc = "0.2"
thread_local = "1.1"
