[package]
name = "coro_tokio_baseline"
version = "0.1.0"
edition = "2021"
description = "coro_delegation's lock-fairness workload on the real tokio multi-thread runtime with off-the-shelf locks (cross-runtime baseline)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
async-lock = "3"
parking_lot = "0.12"
core_affinity = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "tokio-bench"
path = "src/main.rs"
