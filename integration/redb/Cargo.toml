[package]
name = "redb_transactions"
version = "0.1.0"
edition = "2021"

[workspace]

# Cross-crate thin LTO for upstream, patched and test_hooks alike: without it the
# insert closure (monomorphised here, not in redb) measured 2-4% slower than the
# former in-redb fixed body; with it all variants match (README "Known limits").
[profile.release]
lto = "thin"

# Exactly one of `upstream` and `patched` per binary; build.py selects them and
# records the resolved feature sets in build.json.
[features]
upstream = ["dep:redb_upstream"]
patched = ["dep:redb", "dep:libdlock"]
test_hooks = ["patched", "redb/dlock_test_hooks"]
# rdtscp service time of each write body, charged to its requester (upstream: the
# same span in this harness; patched: inside redb's shared closure body).
service_time = ["redb?/dlock_service_time"]
# E0(b) FC-PQ fast path and its per-thread hit counter (libdlock features).
fcpq_fast_path = ["libdlock?/fcpq_fast_path"]
fcpq_fast_path_stat = ["libdlock?/fcpq_fast_path_stat"]
# Combiner pass counters of FC and FC-PQ (bodies per pass, combiner changes);
# only the separate stats binary carries them (build.py `patched_stats`).
combiner_pass_stat = ["libdlock?/combiner_pass_stat"]

[dependencies]
# Upstream redb 3.1.0 from crates.io, untouched (the `upstream` variant).
redb_upstream = { package = "redb", version = "=3.1.0", optional = true }
# The same crate archive with the numbered patches in patches/ applied by build.py.
redb = { path = "../../.worktree/redb-src/redb-3.1.0", optional = true }
libdlock = { path = "../../crates/libdlock", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core_affinity = "0.8"
