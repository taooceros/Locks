[package]
name = "redb_transactions"
version = "0.1.0"
edition = "2021"

[workspace]

# Exactly one of `native` and `patched` per binary; build.py selects them.
[features]
native = ["dep:redb_upstream"]
patched = ["dep:redb", "dep:libdlock"]
test_hooks = ["patched", "redb/dlock_test_hooks"]

[dependencies]
# Upstream redb 3.1.0 from crates.io, untouched (the `native` variant).
redb_upstream = { package = "redb", version = "=3.1.0", optional = true }
# The same crate archive with the numbered patches in patches/ applied by build.py.
redb = { path = "../../.worktree/redb-src/redb-3.1.0", optional = true }
libdlock = { path = "../../crates/libdlock", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core_affinity = "0.8"
